name: EAS Android APK Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS Build profile
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Trigger EAS Android APK Build
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive --no-wait
